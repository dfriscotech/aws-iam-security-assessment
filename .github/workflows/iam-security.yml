
name: AWS IAM Security Assessment

# Trigger the workflow when a pull request targets main
# or when code is pushed directly to main.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Grant only read access to repository contents.
permissions:
  contents: read

jobs:

  # ========================================
  # JOB 1: TERRAFORM VALIDATION
  # ========================================

  terraform-validation:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

  # ========================================
  # JOB 2: CHECKOV SECURITY SCAN
  # ========================================

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: false
